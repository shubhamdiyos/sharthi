# Controlled database migration validation (§8, and the migration half of §2).
#
# Flyway owns the schema (D12, §4.2), so this is not a formality: it is the only
# job that asks whether the database the design describes is the database that
# actually gets built, and it answers from the server's own point of view rather
# than from a Java test's. It runs against a PostgreSQL 16 created for the job,
# with the Flyway version the api pom declares — the resolved flyway-core is
# 12.4.0, so the CLI image is pinned to exactly that. A newer CLI validates against
# rules the deployed application does not have.
#
# Five things this proves, in order:
#   1. every migration applies, in sequence, to an empty database;
#   2. applying the same set twice changes nothing, so a restarted container is safe;
#   3. the guarantees V1 claims are enforced by the server, not only by
#      FoundationSchemaIT: audit_event refuses UPDATE, DELETE and TRUNCATE, job_key
#      is a closed list, an idempotency key belongs to one tenant, business_day is
#      generated by the database;
#   4. `validate` rejects a migration file edited after it ran — the guard that
#      stops a re-deployed pod from carrying a different schema than its history
#      claims. A check nobody has seen fail is not a check;
#   5. the history a reviewer would ask for is printed even on success.
#
# The "database with the previous schema" case from §8 is step 1 taken as a loop:
# with one migration it runs once, and the day V2 lands it applies V1, then V1+V2,
# which is exactly the upgrade path a deployment takes. No edit to this file is
# needed for that to start working.
#
# Why this is a separate workflow instead of a third ci.yml job, and why it is
# path-filtered:
#   ci.yml's integration job already migrates a fresh database on every pull
#   request —
#   ItDatabase runs Flyway against saathi_it — so "the migrations apply" is never
#   unmonitored. What this file adds is the server-side constraint assertions and
#   the tamper proof, and those only change when a migration file does. Running
#   them on a commit that touched no SQL would spend free Actions minutes
#   re-asserting yesterday's answer. The required checks therefore stay unit +
#   integration; this one reports only when it has something to check.

name: database-migrations

on:
  push:
    branches: [main]
    paths:
      - 'services/api/src/main/resources/db/migration/**'
      - 'infra/ci/**'
      - '.github/workflows/database-migrations.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/src/main/resources/db/migration/**'
      - 'infra/ci/**'
      - '.github/workflows/database-migrations.yml'

# Nothing here writes to the repository or to any deployed environment.
permissions:
  contents: read

# Same branch-keyed de-duplication as ci.yml: two pushes to one branch describe the
# work-in-progress and must cost one run. Branch pushes no longer trigger this
# workflow at all except on main — the pull request run of the branch is the check
# (see the reason recorded in ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  SQL_DIR: services/api/src/main/resources/db/migration
  PG_USER: saathi
  # An ephemeral password for a container that is created and destroyed inside one
  # job on a machine nobody else sees. It is not a credential, and it is not secret:
  # committing it is what lets the migration check run without reading anything from
  # repository secrets (§9's "no secrets in logs/artifacts" rule stays satisfied
  # because there is no real secret in either place).
  PG_PASSWORD: ci-ephemeral-not-a-secret
  PG_PORT: '5432'
  PG_IMAGE: postgres:16
  FLYWAY_IMAGE: flyway/flyway:12.4.0-alpine
  # Two databases, both owned by this job. saathi_migration is the deployment path;
  # saathi_tamper exists only so the checksum guard can be shown firing.
  MIGRATION_DB: saathi_migration
  TAMPER_DB: saathi_tamper

jobs:
  migrations:
    name: Flyway against a clean PostgreSQL 16
    runs-on: ubuntu-latest
    # A migration that hangs on a lock should fail loudly, not hold a private-repo
    # minute until the platform kills the run at 360.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saathi
          POSTGRES_PASSWORD: ci-ephemeral-not-a-secret
          POSTGRES_DB: saathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      # The psql and flyway commands the rest of this job calls are not the
      # runner's: they are scripts committed to the repository, which is what lets
      # the same validation be reproduced on a laptop before pushing (§14).
      - name: Put the repository's psql and flyway wrappers on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/infra/ci/bin" >> "$GITHUB_PATH"

      - name: Create the two databases this job owns
        shell: bash
        run: |
          set -euo pipefail
          psql -d postgres -q -c "CREATE DATABASE $MIGRATION_DB" -c "CREATE DATABASE $TAMPER_DB"

      - name: Apply every migration in sequence to an empty database
        shell: bash
        run: |
          set -euo pipefail
          # `-url=` and `-target=`, with an equals sign: Flyway 12's CLI rejects the
          # colon form outright ("Invalid flag"), so this is the syntax that has to
          # survive into the deployment job, where the same commands run for real.
          url="-url=jdbc:postgresql://127.0.0.1:$PG_PORT/$MIGRATION_DB"
          for file in $(ls "$SQL_DIR"/V*.sql | sort -V); do
            version=$(basename "$file" | sed -E 's/^V([0-9.]+)__.*/\1/')
            echo "::group::migrate up to version $version"
            # -target is what makes this the upgrade path rather than one big apply:
            # iteration N leaves the database exactly where a deployment of release N
            # would leave it, which is the state iteration N+1 then has to accept.
            flyway $url migrate "-target=$version"
            flyway $url info
            echo "::endgroup::"
          done

      - name: Validate, and apply the whole set a second time
        shell: bash
        run: |
          set -euo pipefail
          url="-url=jdbc:postgresql://127.0.0.1:$PG_PORT/$MIGRATION_DB"
          flyway $url migrate
          flyway $url validate
          flyway $url info

          # The loop above already applied everything, so this migrate must have
          # applied nothing. The history is the evidence, so it is counted rather
          # than trusted: one row per migration file, and no more.
          expected=$(ls "$SQL_DIR"/V*.sql | wc -l | tr -d ' ')
          actual=$(psql -d "$MIGRATION_DB" -tAc \
            'SELECT count(*) FROM flyway_schema_history WHERE success')
          if [ "$expected" != "$actual" ]; then
            echo "expected $expected applied migration(s); history holds $actual"
            exit 1
          fi

      - name: Assert the constraints the design says the database enforces
        shell: bash
        run: |
          set -euo pipefail

          for table in audit_event idempotency_record outbox_event job_run; do
            psql -d "$MIGRATION_DB" -tAc \
              "SELECT 1 FROM information_schema.tables
                WHERE table_schema='public' AND table_name='$table'" | grep -q 1 \
              || { echo "$table is missing"; exit 1; }
          done

          # The append-only triggers on UPDATE and DELETE are row-level, so they
          # only fire for a row that exists. Asserting them against an empty table
          # would pass for the wrong reason — the tamper proof below is the same
          # lesson: seed first, then require the refusal.
          #
          # occurred_at is written explicitly rather than left to now(), because the
          # date assertion underneath depends on it: a CI run after 18:30 UTC would
          # otherwise land on a different Indian day than the one coded below.
          psql -d "$MIGRATION_DB" -q -c \
            "INSERT INTO audit_event (id, tenant_id, actor_type, action, entity, entity_id, occurred_at)
             VALUES ('01JZC4WQ8S2N7F5K9M3H6T0R1V','01JZC4WQ8S2N7F5K9M3H6T0R1W',
                     'SYSTEM','STATE_TRANSITION','order','ci-probe',
                     TIMESTAMPTZ '2026-10-30T20:00:00Z')"

          # §13.1, from the server's own mouth. The trigger raises SQLSTATE SA001
          # with an "append-only" message, so the refusal's reason is checked as well
          # as the refusal: something failing for a different cause means the guard
          # itself changed. The output is captured rather than piped because Actions
          # runs every bash step with `-o pipefail`, which would read psql's own
          # non-zero exit as the assertion failing — the exact opposite of the point.
          for statement in \
            "UPDATE audit_event SET action='X' WHERE id='01JZC4WQ8S2N7F5K9M3H6T0R1V'" \
            "DELETE FROM audit_event WHERE id='01JZC4WQ8S2N7F5K9M3H6T0R1V'" \
            "TRUNCATE audit_event"; do
            refusal=$(psql -d "$MIGRATION_DB" -c "$statement" 2>&1 || true)
            printf '%s\n' "$refusal" | grep -q 'append-only' \
              || { echo "audit_event did not refuse with the append-only message: $statement"; exit 1; }
          done

          # §4.6's closed job list, enforced by a CHECK rather than by a reviewer.
          if psql -d "$MIGRATION_DB" -c \
            "INSERT INTO job_run (id, job_key, tenant_id, run_key, business_day)
             VALUES ('01JZC4WQ8S2N7F5K9M3H6T0R1X','auto_reject_stale_orders',
                     '01JZC4WQ8S2N7F5K9M3H6T0R1W','ci',DATE '2026-10-30')" >/dev/null 2>&1; then
            echo 'job_run accepted a job key that §4.6 closed the list against'
            exit 1
          fi

          # Tenant isolation of an idempotency key (§10.3): the primary key has to
          # start with tenant_id, or one city's replay can claim another's order.
          psql -d "$MIGRATION_DB" -tAc \
            "SELECT string_agg(a.attname, ',' ORDER BY k.ord)
               FROM pg_index i
               JOIN pg_class c ON c.oid = i.indrelid AND i.indisprimary
               JOIN unnest(i.indkey) WITH ORDINALITY k(attnum, ord) ON true
               JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum = k.attnum
              WHERE c.relname = 'idempotency_record'" \
            | grep -q '^tenant_id,' \
            || { echo 'idempotency_record is not keyed by tenant first'; exit 1; }

          # business_day is the Indian date the reconciliation jobs page by (§4.6),
          # and only a generated column keeps it true for a hand-inserted row. The
          # text is compared, not a boolean: psql prints `-tAc` results as t/f, so a
          # query shaped like `SELECT x = 'ALWAYS'` passes on the literal "true"
          # without ever matching the value it returns.
          psql -d "$MIGRATION_DB" -tAc \
            "SELECT is_generated
               FROM information_schema.columns
              WHERE table_name='audit_event' AND column_name='business_day'" | grep -q ALWAYS \
            || { echo 'business_day is not a generated column'; exit 1; }

          # ... and what it generates is the Indian day, not the UTC one: 20:00Z on
          # the 30th is 01:30 on the 31st in Siwan, so the row belongs to the 31st's
          # reconciliation. (The first run of this job asserted the 30th, and the
          # server was right and the assertion was wrong.)
          psql -d "$MIGRATION_DB" -tAc \
            "SELECT business_day
               FROM audit_event
              WHERE id='01JZC4WQ8S2N7F5K9M3H6T0R1V'" | grep -q '2026-10-31' \
            || { echo 'business_day did not derive from the inserted occurred_at'; exit 1; }

      - name: Prove that a migration edited after it ran is refused
        shell: bash
        run: |
          set -euo pipefail
          tampered=/tmp/tampered-migrations
          cp -r "$SQL_DIR" "$tampered"
          printf '\n-- a review note added after the fact\n' >> "$tampered"/V1__foundation_infrastructure.sql

          # Put saathi_tamper into the state a deployed database is in: migrated
          # from the real, untouched directory.
          flyway "-url=jdbc:postgresql://127.0.0.1:$PG_PORT/$TAMPER_DB" migrate

          # Then validate that history against the edited copy. /flyway/sql is the
          # location the image reads, so FLYWAY_SQL_DIR is what the wrapper mounts
          # over it; the original directory is never modified.
          if FLYWAY_SQL_DIR=$tampered flyway \
            "-url=jdbc:postgresql://127.0.0.1:$PG_PORT/$TAMPER_DB" validate; then
            echo 'validate accepted an edited migration; the guard is not real'
            exit 1
          fi
          echo 'validate refused the edited migration, which is the point'

      - name: Show the history a reviewer would ask for
        if: always()
        shell: bash
        run: |
          psql -d "$MIGRATION_DB" -c \
            "SELECT version, description, checksum IS NOT NULL AS checksummed, installed_on
               FROM flyway_schema_history ORDER BY installed_rank"
