# Dependabot version updates (§9's dependency scanning).
#
# What is known, measured rather than assumed. **Version updates** cost nothing in
# Actions minutes and open a pull request at most on the schedule below; GitHub reads
# this file only from the default branch, so it stays inert until it is merged.
# **Dependabot alerts** do not work on this repository today: the API answers
# 403 "Dependabot alerts are disabled for this repository", and the switch for that
# lives behind GitHub Advanced Security on a private plan. That is why the
# vulnerability gate is the osv-scanner job in security.yml, which reads a CycloneDX
# SBOM built by Maven and needs no GitHub feature at all. The two are not redundant:
# Dependabot tells you a newer version exists, OSV tells you whether the version you
# resolved is unsafe.
#
# The cost version updates do have is indirect and worth naming: every pull request it
# opens triggers ci.yml and security.yml, so an unbounded bot could spend the monthly
# minutes on version bumps. `open-pull-requests-limit` is the throttle, grouped
# updates are the reduction, and both are set deliberately low.
version: 2
updates:
  - package-ecosystem: maven
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    # Five open bump PRs at a time, for a two-person company, is generous. The
    # default of 5 is kept rather than raised: a Spring Boot minor-line change is
    # not something to merge in bulk.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR per ecosystem-and-kind rather than one per artifact: 126 resolved
      # components against 5 open PRs needs grouping to stay reviewable.
      spring-boot:
        patterns:
          - org.springframework*
      junit:
        patterns:
          - org.junit*
          - org.mockito*
          - org.assertj*
  # npm is here because apps/web/package-lock.json is: lockfileVersion 3, 455
  # resolved packages. Dependabot reads this file from the default branch only, so
  # what "joins" it is the merge, not this pull request.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    # The same throttle as Maven, for the same reason: a React-major bump is a
    # migration, not a merge button, and five open bot PRs is already more than
    # two people can review in a week between shipping.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The framework moves together or not at all: next 16.x pins a react range,
      # and a PR that bumps one without the other is a build failure waiting to be
      # reviewed.
      next-and-react:
        patterns:
          - next
          - react
          - react-dom
      # The toolchain is one coherent upgrade — eslint-config-next moves with
      # eslint and with the pinned typescript line.
      toolchain:
        patterns:
          - eslint
          - eslint-config-next
          - typescript
          - vitest
          - '@types/*'
    # One proposal the toolchain cannot consume, measured rather than predicted.
    # `eslint-config-next` bundles `typescript-eslint`, whose own peer range is
    # `typescript: >=4.8.4 <6.1.0`; Dependabot's toolchain-group PR #11 rewrote
    # `^6.0.3` to `^7.0.2`, and the run's very first gate died on it —
    # `npm run lint` printed "typescript-eslint does not support TS 7.0" and exited 2
    # before reading a single source file, which is a gate that has stopped gating.
    # The range is capped at `~6.0.3` in package.json for the same reason: `^6.0.3`
    # would let a future 6.1.0 float into a fresh install and reproduce the identical
    # breakage, because the peer ceiling is exclusive of 6.1. Revisit only when
    # typescript-eslint's range moves (tracked upstream in
    # typescript-eslint/typescript-eslint#10940) — not before, because a weekly bot
    # would otherwise keep opening a PR whose lint step is decoration.
    ignore:
      - dependency-name: typescript
        versions:
          - '>= 6.1.0'
